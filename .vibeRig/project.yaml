version: 2
project:
  name: "vb-plugin"
  root: "."
  repo_url: "https://github.com/JsonLee12138/vibeRig.git"
  architecture: "docs/design/skill-workflow-optimization.zh-CN.md"
documents:
  mode: "discover"
  requirement_root: ".vibeRig/requirements"
  exec_plan_root: "docs/exec-plans"
  runbook_index: "docs/runbooks/index.md"
  context_routes: ".vibeRig/context-routes.yaml"
environment:
  manifest: ".vibeRig/environments.yaml"
  default_profile: "local"
commands:
  bootstrap: "pnpm install --frozen-lockfile"
  start: "pnpm dev"
  reset: ""
  health: "pnpm run typecheck"
  targeted_test: "pnpm test"
  smoke: "pnpm run build"
evidence:
  root: "artifacts/viberig"
  retention: "accepted_only"
tracking:
  provider: "linear"
  mode: "adapter"
output:
  language: "zh-CN"
pull_request:
  required: "true"
  provider: "auto"
  base_branch: ""
  draft: "false"
linear:
  team_id: "d468277e-24d2-447d-a981-a20e0f1a7693"
  project_id: "42fb3e1e-400d-4d35-92b7-271508ee8653"
  project_document_id: ""
  project_document_title: "VibeRig Project Registration"
gate_policy:
  hooks_enabled: false
  ci_required: "project_decides"
  required_commands: []
  manual_checks: []
subagents:
  default_research: "researcher"
  default_qa: "qa"
  default_security_audit: "security_auditor"
  default_review: "code_review"
